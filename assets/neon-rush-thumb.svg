<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="nrBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140728"/>
      <stop offset="50%" stop-color="#090518"/>
      <stop offset="100%" stop-color="#02030a"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffea00"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <filter id="rushGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#nrBg)"/>

  <!-- Synthwave Neon Sun in background -->
  <circle cx="300" cy="170" r="70" fill="url(#sunGrad)" opacity="0.65" filter="url(#rushGlow)"/>
  <rect x="220" y="150" width="160" height="3" fill="#090518"/>
  <rect x="225" y="160" width="150" height="4" fill="#090518"/>
  <rect x="230" y="172" width="140" height="5" fill="#090518"/>
  <rect x="240" y="186" width="120" height="6" fill="#090518"/>

  <!-- 3D Perspective Ground Grid -->
  <polygon points="0,210 600,210 600,380 0,380" fill="#060515"/>
  <line x1="0" y1="210" x2="600" y2="210" stroke="#ff007f" stroke-width="2" filter="url(#rushGlow)"/>
  
  <!-- Perspective Lines converging toward center horizon -->
  <line x1="300" y1="210" x2="0" y2="380" stroke="#00f2fe" stroke-width="1.5" opacity="0.6"/>
  <line x1="300" y1="210" x2="100" y2="380" stroke="#00f2fe" stroke-width="1.5" opacity="0.6"/>
  <line x1="300" y1="210" x2="200" y2="380" stroke="#00f2fe" stroke-width="1.5" opacity="0.7"/>
  <line x1="300" y1="210" x2="300" y2="380" stroke="#00f2fe" stroke-width="2" opacity="0.8"/>
  <line x1="300" y1="210" x2="400" y2="380" stroke="#00f2fe" stroke-width="1.5" opacity="0.7"/>
  <line x1="300" y1="210" x2="500" y2="380" stroke="#00f2fe" stroke-width="1.5" opacity="0.6"/>
  <line x1="300" y1="210" x2="600" y2="380" stroke="#00f2fe" stroke-width="1.5" opacity="0.6"/>

  <!-- Horizontal Grid Bars in perspective -->
  <line x1="0" y1="225" x2="600" y2="225" stroke="#ff007f" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="245" x2="600" y2="245" stroke="#ff007f" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="275" x2="600" y2="275" stroke="#ff007f" stroke-width="1.2" opacity="0.5"/>
  <line x1="0" y1="315" x2="600" y2="315" stroke="#ff007f" stroke-width="1.5" opacity="0.6"/>
  <line x1="0" y1="365" x2="600" y2="365" stroke="#ff007f" stroke-width="2" opacity="0.7"/>

  <!-- Glowing Neon Coins -->
  <circle cx="340" cy="180" r="9" fill="#ffea00" filter="url(#rushGlow)"/>
  <circle cx="340" cy="180" r="5" fill="#ffffff"/>
  <circle cx="380" cy="160" r="11" fill="#ffea00" filter="url(#rushGlow)"/>
  <circle cx="380" cy="160" r="6" fill="#ffffff"/>
  <circle cx="420" cy="150" r="13" fill="#ffea00" filter="url(#rushGlow)"/>
  <circle cx="420" cy="150" r="7" fill="#ffffff"/>

  <!-- Laser Hurdle / Obstacle -->
  <polygon points="460,280 470,240 480,280" fill="#ff0055" filter="url(#rushGlow)"/>
  <polygon points="480,280 490,230 500,280" fill="#ff0055" filter="url(#rushGlow)"/>
  <polygon points="500,280 510,245 520,280" fill="#ff0055" filter="url(#rushGlow)"/>

  <!-- Cyber Runner Character Dashing -->
  <g transform="translate(180, 205)">
    <!-- Speed Motion Trails -->
    <line x1="-50" y1="25" x2="0" y2="25" stroke="#00f2fe" stroke-width="3" opacity="0.5"/>
    <line x1="-35" y1="40" x2="10" y2="40" stroke="#00ff88" stroke-width="2" opacity="0.6"/>
    <line x1="-60" y1="65" x2="-10" y2="65" stroke="#00f2fe" stroke-width="3" opacity="0.4"/>

    <!-- Runner Head / Helmet Visor -->
    <circle cx="45" cy="15" r="12" fill="#00f2fe" filter="url(#rushGlow)"/>
    <rect x="42" y="12" width="14" height="6" rx="3" fill="#ffea00"/>

    <!-- Runner Body / Torso -->
    <polygon points="35,26 52,26 42,55 30,52" fill="#00f2fe"/>
    <polygon points="38,28 48,28 42,48 34,46" fill="#ffffff"/>

    <!-- Front Leg -->
    <polyline points="40,54 58,70 78,65" fill="none" stroke="#00ff88" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#rushGlow)"/>

    <!-- Back Leg -->
    <polyline points="32,52 14,64 0,78" fill="none" stroke="#00f2fe" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#rushGlow)"/>

    <!-- Arms -->
    <polyline points="42,32 60,38 72,30" fill="none" stroke="#00f2fe" stroke-width="4" stroke-linecap="round"/>
    <polyline points="36,32 18,36 8,46" fill="none" stroke="#00ff88" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Title Badge Overlay -->
  <rect x="210" y="325" width="180" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 0, 127, 0.4)" stroke-width="1.5"/>
  <text x="300" y="349" font-family="'Outfit', sans-serif" font-size="16" font-weight="900" fill="#ff007f" text-anchor="middle" letter-spacing="2">NEON RUSH</text>
</svg>

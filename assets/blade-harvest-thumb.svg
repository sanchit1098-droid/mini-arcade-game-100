<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e30"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <radialGradient id="melonFlesh" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="85%" stop-color="#d50000"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#bg)"/>
  <circle cx="300" cy="190" r="140" fill="#00f2fe" opacity="0.06" filter="url(#glow)"/>

  <!-- Left Sliced Watermelon Half -->
  <g transform="translate(230, 190) rotate(-18)">
    <!-- Rind -->
    <path d="M 0 -70 A 70 70 0 0 0 0 70 Z" fill="#1b5e20"/>
    <!-- Pith -->
    <path d="M 0 -63 A 63 63 0 0 0 0 63 Z" fill="#e8f5e9"/>
    <!-- Flesh -->
    <path d="M 0 -57 A 57 57 0 0 0 0 57 Z" fill="url(#melonFlesh)"/>
    <!-- Seeds -->
    <ellipse cx="-24" cy="-25" rx="3.5" ry="6" transform="rotate(-30, -24, -25)" fill="#111"/>
    <ellipse cx="-34" cy="5" rx="3.5" ry="6" fill="#111"/>
    <ellipse cx="-22" cy="30" rx="3.5" ry="6" transform="rotate(30, -22, 30)" fill="#111"/>
  </g>

  <!-- Right Sliced Watermelon Half -->
  <g transform="translate(370, 190) rotate(18)">
    <!-- Rind -->
    <path d="M 0 -70 A 70 70 0 0 1 0 70 Z" fill="#1b5e20"/>
    <!-- Pith -->
    <path d="M 0 -63 A 63 63 0 0 1 0 63 Z" fill="#e8f5e9"/>
    <!-- Flesh -->
    <path d="M 0 -57 A 57 57 0 0 1 0 57 Z" fill="url(#melonFlesh)"/>
    <!-- Seeds -->
    <ellipse cx="24" cy="-25" rx="3.5" ry="6" transform="rotate(30, 24, -25)" fill="#111"/>
    <ellipse cx="34" cy="5" rx="3.5" ry="6" fill="#111"/>
    <ellipse cx="22" cy="30" rx="3.5" ry="6" transform="rotate(-30, 22, 30)" fill="#111"/>
  </g>

  <!-- Orange slice in background -->
  <g transform="translate(480, 110) scale(0.65)">
    <circle cx="0" cy="0" r="45" fill="#e65100"/>
    <circle cx="0" cy="0" r="40" fill="#fff3e0"/>
    <circle cx="0" cy="0" r="36" fill="#ffa726"/>
  </g>

  <!-- Strawberry in background -->
  <g transform="translate(130, 260) scale(0.75)">
    <path d="M 0 35 C -35 15, -35 -25, 0 -30 C 35 -25, 35 15, 0 35 Z" fill="#d50000"/>
    <circle cx="-10" cy="-5" r="2.5" fill="#ffeb3b"/>
    <circle cx="10" cy="-5" r="2.5" fill="#ffeb3b"/>
    <circle cx="0" cy="12" r="2.5" fill="#ffeb3b"/>
  </g>

  <!-- Juice Splatters -->
  <circle cx="280" cy="130" r="7" fill="#ff3838" opacity="0.9"/>
  <circle cx="330" cy="110" r="5" fill="#ff3838" opacity="0.8"/>
  <circle cx="310" cy="260" r="9" fill="#ff3838" opacity="0.85"/>
  <circle cx="270" cy="240" r="5" fill="#ff3838" opacity="0.7"/>
  <circle cx="350" cy="230" r="6" fill="#ff9100" opacity="0.9"/>

  <!-- Glowing Laser Blade Slash -->
  <path d="M 90 310 L 510 70" stroke="url(#blade)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 90 310 L 510 70" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- Badge / Tags -->
  <rect x="25" y="25" width="85" height="26" rx="6" fill="rgba(0, 242, 254, 0.2)" stroke="#00f2fe" stroke-width="1"/>
  <text x="67" y="42" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" text-anchor="middle">ACTION</text>

  <rect x="118" y="25" width="95" height="26" rx="6" fill="rgba(255, 234, 0, 0.15)" stroke="#ffea00" stroke-width="1"/>
  <text x="165" y="42" fill="#ffea00" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" text-anchor="middle">ARCADE</text>
</svg>

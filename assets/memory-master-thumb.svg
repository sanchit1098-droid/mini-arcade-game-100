<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="mmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a20"/>
      <stop offset="100%" stop-color="#04030d"/>
    </linearGradient>
    <filter id="padGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#mmBg)"/>

  <!-- Center Circular Simon Arcade Console Console -->
  <circle cx="300" cy="170" r="130" fill="#0b0f1d" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4"/>
  <circle cx="300" cy="170" r="138" fill="none" stroke="rgba(0, 242, 254, 0.2)" stroke-width="2"/>

  <!-- 4 Glowing Arcade Quadrants / Pads -->
  <!-- Top-Left: Neon Cyan (Active glowing state) -->
  <path d="M 292 48 A 122 122 0 0 0 178 162 L 246 162 A 54 54 0 0 1 292 116 Z" fill="#00f2fe" filter="url(#padGlow)"/>
  <path d="M 290 52 A 118 118 0 0 0 182 160 L 244 160 A 56 56 0 0 1 290 114 Z" fill="#ffffff" opacity="0.3"/>

  <!-- Top-Right: Neon Magenta -->
  <path d="M 308 48 A 122 122 0 0 1 422 162 L 354 162 A 54 54 0 0 0 308 116 Z" fill="#ff007f" filter="url(#padGlow)" opacity="0.85"/>
  <path d="M 310 52 A 118 118 0 0 1 418 160 L 356 160 A 56 56 0 0 0 310 114 Z" fill="#ff007f"/>

  <!-- Bottom-Left: Neon Lime Green -->
  <path d="M 178 178 A 122 122 0 0 0 292 292 L 292 224 A 54 54 0 0 1 246 178 Z" fill="#00ff88" filter="url(#padGlow)" opacity="0.85"/>
  <path d="M 182 180 A 118 118 0 0 0 290 288 L 290 226 A 56 56 0 0 1 244 180 Z" fill="#00ff88"/>

  <!-- Bottom-Right: Neon Amber / Yellow -->
  <path d="M 422 178 A 122 122 0 0 1 308 292 L 308 224 A 54 54 0 0 0 354 178 Z" fill="#ffea00" filter="url(#padGlow)" opacity="0.85"/>
  <path d="M 418 180 A 118 118 0 0 1 310 288 L 310 226 A 56 56 0 0 0 356 180 Z" fill="#ffea00"/>

  <!-- Center Hub -->
  <circle cx="300" cy="170" r="48" fill="#070a14" stroke="rgba(255, 255, 255, 0.2)" stroke-width="3"/>
  <circle cx="300" cy="170" r="38" fill="#0f172a"/>
  <!-- Center Play / Audio Symbol -->
  <polygon points="293,155 313,170 293,185" fill="#00f2fe" filter="url(#padGlow)"/>

  <!-- Sound Ripple Waves -->
  <circle cx="300" cy="170" r="160" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.3"/>
  <circle cx="300" cy="170" r="185" fill="none" stroke="#ff007f" stroke-width="1.5" opacity="0.15"/>

  <!-- Floating Audio Notes / Chimes -->
  <text x="110" y="90" font-family="'Outfit', sans-serif" font-size="28" fill="#00f2fe" filter="url(#padGlow)">♪</text>
  <text x="470" y="85" font-family="'Outfit', sans-serif" font-size="32" fill="#ff007f" filter="url(#padGlow)">♫</text>
  <text x="90" y="270" font-family="'Outfit', sans-serif" font-size="26" fill="#00ff88" filter="url(#padGlow)">♫</text>
  <text x="485" y="280" font-family="'Outfit', sans-serif" font-size="30" fill="#ffea00" filter="url(#padGlow)">♪</text>

  <!-- Title Badge Overlay -->
  <rect x="180" y="325" width="240" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(191, 85, 236, 0.4)" stroke-width="1.5"/>
  <text x="300" y="349" font-family="'Outfit', sans-serif" font-size="16" font-weight="900" fill="#bf55ec" text-anchor="middle" letter-spacing="2">MEMORY MASTER</text>
</svg>
